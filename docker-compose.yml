services:
  dev-default:
    build: .
    image: dev-default:latest
    networks:
      - traefik-network
    ports:
      - "9300:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.my-ip-router.rule=Host(`dev.enyard.in`) || Host(`10.0.0.7`)"
      - "traefik.http.routers.my-ip-router.entrypoints=web"
      - "traefik.http.services.dev-default.loadbalancer.server.port=8080" # Your app's internal port

networks:
  traefik-network:
    external: true
