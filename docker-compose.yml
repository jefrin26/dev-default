services:
  my-service:
    build: .
    image: dev-default:latest
    networks:
      - traefik-network
    ports:
      - "93000:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.my-ip-router.rule=Host(`10.0.0.7`)"
      - "traefik.http.routers.my-ip-router.entrypoints=web"
      - "traefik.http.services.my-service.loadbalancer.server.port=8080" # Your app's internal port

networks:
  traefik-network:
    external: true
